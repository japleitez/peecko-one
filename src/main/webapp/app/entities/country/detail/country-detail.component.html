<div class="d-flex justify-content-center">
  <div class="col-8">
    @if (country) {
      <div>
        <h2 data-cy="countryDetailsHeading"><span>Country</span></h2>

        <hr />

        <jhi-alert-error></jhi-alert-error>

        <jhi-alert></jhi-alert>

        <dl class="row-md jh-entity-details">
          <dt *ngIf="ua.code.visible"><span>Code</span></dt>
          <dd *ngIf="ua.code.visible">
            <span>{{ country.code }}</span>
          </dd>
          <dt *ngIf="ua.name.visible"><span>Name</span></dt>
          <dd *ngIf="ua.name.visible">
            <span>{{ country.name }}</span>
          </dd>
          <dt *ngIf="ua.locale.visible"><span>Locale</span></dt>
          <dd *ngIf="ua.locale.visible">
            <span>{{ country.locale }}</span>
          </dd>
          <dt *ngIf="ua.currency.visible"><span>Currency</span></dt>
          <dd *ngIf="ua.currency.visible">
            <span>{{ country.currency }}</span>
          </dd>
          <dt *ngIf="ua.language.visible"><span>Language</span></dt>
          <dd *ngIf="ua.language.visible">
            <span>{{ country.language }}</span>
          </dd>
        </dl>

        <button type="submit" (click)="previousState()" class="btn btn-info" data-cy="entityDetailsBackButton">
          <fa-icon icon="arrow-left"></fa-icon>&nbsp;<span>Back</span>
        </button>

        <button type="button" [routerLink]="['/country', country.code, 'edit']" class="btn btn-primary">
          <fa-icon icon="pencil-alt"></fa-icon>&nbsp;<span>Edit</span>
        </button>
      </div>
    }
  </div>
</div>
