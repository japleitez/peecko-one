<mat-form-field class="w-50" subscriptSizing="dynamic">
  <mat-label>Category</mat-label>
  <input type="text" matInput placeholder="" aria-label="Category" [formControl]="control" [matAutocomplete]="auto" (blur)="onBlur()" />
  <mat-autocomplete #auto="matAutocomplete" [displayWith]="displayName" (closed)="resolveTypedText()">
    @for (category of filteredCategories | async; track category) {
      <mat-option [value]="category">{{ category.title }}</mat-option>
    }
  </mat-autocomplete>
  @if (control.hasError('selectionRequired')) {
    <mat-error>Select a category from the list</mat-error>
  }
</mat-form-field>
