<mat-form-field class="w-50" subscriptSizing="dynamic">
  <mat-label>Coach</mat-label>
  <input type="text" matInput placeholder="" aria-label="Agency" [formControl]="control" [matAutocomplete]="auto" (blur)="onBlur()" />
  <mat-autocomplete #auto="matAutocomplete" [displayWith]="displayName" (closed)="resolveTypedText()">
    @for (coach of filteredCoaches | async; track coach) {
      <mat-option [value]="coach">{{ coach.name }}</mat-option>
    }
  </mat-autocomplete>
  @if (control.hasError('selectionRequired')) {
    <mat-error>Select a coach from the list</mat-error>
  }
</mat-form-field>
