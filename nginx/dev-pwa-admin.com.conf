upstream sapi_backend {
    server 127.0.0.1:8081;
}

upstream admin_backend {
    server 127.0.0.1:8080;
}

server {
    listen 80;
    server_name dev-pwa-admin.com;  # Include www if needed

    # Proxy for /sapi/* to the REST API (sapi) backend
    location /sapi/ {
        proxy_pass http://sapi_backend/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy for /admin/* to the Spring Boot admin app (handles both frontend and /api)
    # Since context-path=/admin, proxy /admin/foo -> /admin/foo on backend
    location /admin/ {
        proxy_pass http://admin_backend/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Optional: Root path redirect or error handling
    location / {
        return 301 https://$host/admin/;  # Redirect root to /admin/, adjust as needed
    }
}
