<mat-form-field [class]="this.cl" subscriptSizing="dynamic">
  <mat-label>Aps Plan</mat-label>
  <input type="text" matInput placeholder="" aria-label="Aps Plan" [formControl]="control" [matAutocomplete]="auto" (blur)="onBlur()" />
  <mat-autocomplete #auto="matAutocomplete" [displayWith]="displayName" (closed)="resolveTypedText()">
    @for (plan of filteredPlans | async; track plan) {
      <mat-option [value]="plan">{{ plan.contract }}</mat-option>
    }
  </mat-autocomplete>
  @if (control.hasError('selectionRequired')) {
    <mat-error>Select a plan from the list</mat-error>
  }
</mat-form-field>
