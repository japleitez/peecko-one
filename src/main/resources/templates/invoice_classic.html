<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Invoice {{invoice.number}}</title>
    <link
      href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink-900: #0a0a0a;
        --ink-700: #2e2e2e;
        --ink-500: #5a5a5a;
        --ink-300: #9a9a9a;
        --ink-150: #d4d4d4;
        --ink-80: #e8e8e8;
        --ink-40: #f3f3f3;
        --paper: #ffffff;
        --total-bg: #e2e2e2;
        --total-ink: #0a0a0a;
        --font-serif: 'EB Garamond', Georgia, serif;
        --font-mono: 'JetBrains Mono', 'Courier New', monospace;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        background: var(--paper);
        color: var(--ink-900);
        font-family: var(--font-serif);
        font-size: 10pt;
        line-height: 1.6;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }

      .page {
        width: 210mm;
        min-height: 297mm;
        margin: 0 auto;
        padding: 14mm 16mm 14mm 16mm;
        display: flex;
        flex-direction: column;
        gap: 0;
      }

      /* ── HEADER ─────────────────────────────────────────── */
      .header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        border-bottom: 2.5px solid var(--ink-900);
        padding-bottom: 7mm;
        margin-bottom: 8mm;
      }

      .header-left {
        display: flex;
        flex-direction: column;
        gap: 2mm;
      }

      .invoice-title {
        font-family: var(--font-serif);
        font-size: 28pt;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--ink-900);
        line-height: 1;
      }

      .invoice-number-block {
        display: flex;
        flex-direction: column;
        gap: 0.5mm;
      }

      .invoice-number-label {
        font-family: var(--font-mono);
        font-size: 6.5pt;
        font-weight: 500;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--ink-300);
      }

      .invoice-number-value {
        font-family: var(--font-mono);
        font-size: 12pt;
        font-weight: 600;
        color: var(--ink-900);
        letter-spacing: 0.06em;
      }

      .header-right {
        text-align: right;
        display: flex;
        flex-direction: column;
        gap: 1mm;
      }

      .meta-row {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 0.5mm;
      }

      .meta-label {
        font-family: var(--font-mono);
        font-size: 6pt;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--ink-300);
        line-height: 1;
      }

      .meta-value {
        font-family: var(--font-mono);
        font-size: 9pt;
        font-weight: 400;
        color: var(--ink-700);
      }

      .due-value {
        font-family: var(--font-mono);
        font-size: 9.5pt;
        font-weight: 600;
        color: var(--ink-900);
        border-bottom: 1.5px solid var(--ink-900);
        padding-bottom: 0.3mm;
      }

      /* ── PARTIES ─────────────────────────────────────────── */
      .parties {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0 12mm;
        margin-bottom: 8mm;
      }

      .party {
        display: flex;
        flex-direction: column;
        gap: 1mm;
      }

      .party-label {
        font-family: var(--font-mono);
        font-size: 6pt;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--ink-300);
        border-bottom: 1px solid var(--ink-150);
        padding-bottom: 1.5mm;
        margin-bottom: 1.5mm;
      }

      .party-name {
        font-family: var(--font-serif);
        font-size: 11pt;
        font-weight: 600;
        color: var(--ink-900);
        line-height: 1.3;
      }

      .party-address {
        font-family: var(--font-serif);
        font-size: 9.5pt;
        color: var(--ink-500);
        line-height: 1.55;
      }

      .party-meta {
        margin-top: 1.5mm;
        display: flex;
        flex-direction: column;
        gap: 0.5mm;
      }

      .party-meta-row {
        font-family: var(--font-mono);
        font-size: 7.5pt;
        color: var(--ink-500);
        display: flex;
        gap: 2mm;
      }

      .party-meta-row span:first-child {
        color: var(--ink-300);
        min-width: 9mm;
      }

      /* ── PERIOD ROW ──────────────────────────────────────── */
      .period-row {
        display: flex;
        justify-content: flex-end;
        align-items: center;
        gap: 3mm;
        margin-bottom: 3mm;
      }

      .period-label {
        font-family: var(--font-mono);
        font-size: 6.5pt;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--ink-300);
      }

      .period-value {
        font-family: var(--font-mono);
        font-size: 8.5pt;
        font-weight: 500;
        color: var(--ink-700);
        border: 1px solid var(--ink-150);
        padding: 1mm 3mm;
        letter-spacing: 0.04em;
      }

      /* ── TABLE ───────────────────────────────────────────── */
      .invoice-table {
        width: 100%;
        border-collapse: collapse;
        margin-bottom: 6mm;
      }

      .invoice-table thead tr {
        background: var(--ink-900);
      }

      .invoice-table thead th {
        font-family: var(--font-mono);
        font-size: 7pt;
        font-weight: 500;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--paper);
        padding: 2.5mm 3mm;
        text-align: left;
      }

      .invoice-table thead th:not(:first-child) {
        text-align: right;
      }

      .invoice-table tbody tr {
        border-bottom: 1px solid var(--ink-80);
      }

      .invoice-table tbody tr:nth-child(even) {
        background: var(--ink-40);
      }

      .invoice-table tbody td {
        font-family: var(--font-serif);
        font-size: 9.5pt;
        color: var(--ink-700);
        padding: 2.5mm 3mm;
        vertical-align: top;
      }

      .invoice-table tbody td:not(:first-child) {
        font-family: var(--font-mono);
        font-size: 8.5pt;
        text-align: right;
      }

      /* ── SUMMARY ─────────────────────────────────────────── */
      .summary-block {
        margin-left: auto;
        width: 72mm;
        margin-bottom: 10mm;
      }

      .summary-row {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        padding: 1.8mm 3mm;
        border-bottom: 1px solid var(--ink-80);
      }

      .summary-row:first-child {
        border-top: 1px solid var(--ink-150);
      }

      .summary-row-label {
        font-family: var(--font-mono);
        font-size: 7.5pt;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--ink-500);
      }

      .summary-row-value {
        font-family: var(--font-mono);
        font-size: 9pt;
        font-weight: 400;
        color: var(--ink-700);
      }

      .summary-row.total-row {
        background: var(--total-bg);
        border-bottom: 2px solid var(--ink-900);
        border-top: 2px solid var(--ink-900);
        padding: 2.5mm 3mm;
      }

      .summary-row.total-row .summary-row-label {
        font-family: var(--font-mono);
        font-size: 8pt;
        font-weight: 600;
        letter-spacing: 0.14em;
        color: var(--total-ink);
      }

      .summary-row.total-row .summary-row-value {
        font-family: var(--font-mono);
        font-size: 12pt;
        font-weight: 600;
        color: var(--total-ink);
      }

      /* ── BANKING ─────────────────────────────────────────── */
      .banking-block {
        border-top: 1px solid var(--ink-150);
        padding-top: 5mm;
        margin-bottom: 8mm;
      }

      .banking-label {
        font-family: var(--font-mono);
        font-size: 6pt;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--ink-300);
        margin-bottom: 2.5mm;
      }

      .banking-grid {
        display: flex;
        gap: 10mm;
      }

      .banking-item {
        display: flex;
        flex-direction: column;
        gap: 0.5mm;
      }

      .banking-item-label {
        font-family: var(--font-mono);
        font-size: 6pt;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--ink-300);
      }

      .banking-item-value {
        font-family: var(--font-mono);
        font-size: 8.5pt;
        font-weight: 500;
        color: var(--ink-700);
      }

      /* ── FOOTER ──────────────────────────────────────────── */
      .footer {
        margin-top: auto;
        border-top: 1.5px solid var(--ink-900);
        padding-top: 4mm;
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
      }

      .footer-text {
        font-family: var(--font-serif);
        font-style: italic;
        font-size: 8.5pt;
        color: var(--ink-300);
        line-height: 1.6;
      }

      .footer-rule {
        font-family: var(--font-mono);
        font-size: 6pt;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--ink-150);
      }

      @media print {
        html,
        body {
          background: white;
        }
        .page {
          margin: 0;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header class="header">
        <div class="header-left">
          <div class="invoice-title">Invoice</div>
          <div class="invoice-number-block">
            <span class="invoice-number-label">Number</span>
            <span class="invoice-number-value"><span th:text="${invoiceNumber}"></span></span>
          </div>
        </div>
        <div class="header-right">
          <div class="meta-row">
            <span class="meta-label">Issue Date</span>
            <span class="meta-value"><span th:text="${invoiceIssue}"></span></span>
          </div>
          <div class="meta-row" style="margin-top: 2mm">
            <span class="meta-label">Due Date</span>
            <span class="due-value"><span th:text="${invoiceDue}"></span></span>
          </div>
        </div>
      </header>

      <section class="parties">
        <div class="party">
          <div class="party-label">From</div>
          <div class="party-name"><span th:text="${agencyName}"></span></div>
          <div class="party-address">
            <span th:text="${agencyAddressStreet}"></span><br />
            <span th:text="${agencyAddressCity}"></span><br />
            <span th:text="${agencyAddressCountry}"></span>
          </div>
          <div class="party-meta">
            <div class="party-meta-row">
              <span>VAT</span><span><span th:text="${agencyVatNumber}"></span></span>
            </div>
            <div class="party-meta-row">
              <span>IBAN</span><span><span th:text="${agencyBankIban}"></span></span>
            </div>
            <div class="party-meta-row">
              <span>SWIFT</span><span><span th:text="${agencyBankSwift}"></span></span>
            </div>
          </div>
        </div>
        <div class="party">
          <div class="party-label">To</div>
          <div class="party-name"><span th:text="${clientName}"></span></div>
          <div class="party-address">
            <span th:text="${clientAddressStreet}"></span><br />
            <span th:text="${clientAddressCity}"></span><br />
            <span th:text="${clientAddressCountry}"></span>
          </div>
          <div class="party-meta">
            <div class="party-meta-row">
              <span>VAT</span><span><span th:text="${clientVatNumber}"></span></span>
            </div>
            <div class="party-meta-row"><span>CLIENT</span><span th:text="${clientCode}"></span></div>
          </div>
        </div>
      </section>

      <div class="period-row">
        <span class="period-label">Billing Period</span>
        <span class="period-value"><span th:text="${dateFrom}"></span> <span th:text="${dateTo}"></span></span>
      </div>

      <table class="invoice-table">
        <thead>
          <tr>
            <th style="width: 52%">Description</th>
            <th style="width: 12%">Qty</th>
            <th style="width: 18%">Unit Price</th>
            <th style="width: 18%">Subtotal</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td><span th:text="${itemDescription}"></span></td>
            <td><span th:text="${itemQuantity}"></span></td>
            <td><span th:text="${itemUnitPrice}"></span></td>
            <td><span th:text="${itemSubtotal}"></span></td>
          </tr>
        </tbody>
      </table>

      <div class="summary-block">
        <div class="summary-row">
          <span class="summary-row-label">Tax Rate</span>
          <span class="summary-row-value"><span th:text="${invoiceVatRate}"></span></span>
        </div>
        <div class="summary-row">
          <span class="summary-row-label">Tax</span>
          <span class="summary-row-value"><span th:text="${invoiceVat}"></span></span>
        </div>
        <div class="summary-row total-row">
          <span class="summary-row-label">Total Due</span>
          <span class="summary-row-value"><span th:text="${invoiceTotal}"></span></span>
        </div>
      </div>

      <div class="banking-block">
        <div class="banking-label">Payment Details</div>
        <div class="banking-grid">
          <div class="banking-item">
            <span class="banking-item-label">IBAN</span>
            <span class="banking-item-value"><span th:text="${agencyBankIban}"></span></span>
          </div>
          <div class="banking-item">
            <span class="banking-item-label">SWIFT</span>
            <span class="banking-item-value"><span th:text="${agencyBankSwift}"></span></span>
          </div>
        </div>
      </div>

      <footer class="footer">
        <div class="footer-text">
          <span th:text="${agencyFooterLine1}"></span>
        </div>
        <div class="footer-rule"><span th:text="${invoiceNumber}"></span></div>
      </footer>
    </div>
  </body>
</html>
