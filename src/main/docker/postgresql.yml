# This configuration is intended for development purpose, it's **your** responsibility to harden it for production
name: admin
services:
  postgresql:
    image: postgres:16.1
    # volumes:
    #   - ~/volumes/jhipster/admin/postgresql/:/var/lib/postgresql/data/
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=
      - POSTGRES_HOST_AUTH_METHOD=trust
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER}']
      interval: 5s
      timeout: 5s
      retries: 10
    # If you want to expose these ports outside your dev PC,
    # keep "127.0.0.1:" to allow only local access
    # keep "127.0.0.1:" to allow external access from any location
    ports:
      - 0.0.0.0:5432:5432
