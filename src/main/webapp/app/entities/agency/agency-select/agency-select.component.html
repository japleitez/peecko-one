<mat-form-field [class]="this.cl" subscriptSizing="dynamic">
  <mat-label>Agency</mat-label>
  <input type="text" matInput placeholder="" aria-label="Agency" [formControl]="control" [matAutocomplete]="auto" (blur)="onBlur()" />
  <mat-autocomplete #auto="matAutocomplete" [displayWith]="displayName" (closed)="resolveTypedText()">
    @for (agency of filteredAgencies | async; track agency) {
      <mat-option [value]="agency">{{ agency.name }}</mat-option>
    }
  </mat-autocomplete>
  @if (control.hasError('selectionRequired')) {
    <mat-error>Select an agency from the list</mat-error>
  }
</mat-form-field>
